name: Checks

# The app's unit tests and lint, and the relay's tests, for every pull request and on develop.
# Free on a public repository.
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The real Firebase config is a secret that only release builds get. Tests and lint
      # need nothing from it, just a well-formed file naming the app's package.
      - name: Placeholder google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.vagujhelyigergely.sotto" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: app-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The relay's image runs Python 3.12 (server/Dockerfile).
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q
