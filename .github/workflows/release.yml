name: Build & Release APK

# Runs for every pushed version tag (v*), or by hand with that tag's name (workflow_dispatch).
# GitHub never started this file for tag pushes while it was unchanged from the repository's
# first commit (0.6.0 to 0.6.2 were started by hand); changing it in a later commit registered
# its tag trigger. If a tag push ever starts nothing, run it by hand with the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Create keystore.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf '%s\n' "storeFile=../release-keystore.jks" > keystore.properties
          printf 'storePassword=%s\n' "$STORE_PASSWORD" >> keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties

      - name: Build release APK and AAB
        env:
          # The owner's relay (push, invite links, certificate pinning), kept out of the repository.
          SOTTO_OWNER_RELAY_HOST: ${{ secrets.OWNER_RELAY_HOST }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Build debug APK (fallback)
        if: failure()
        env:
          SOTTO_OWNER_RELAY_HOST: ${{ secrets.OWNER_RELAY_HOST }}
        run: ./gradlew assembleDebug

      - name: Get version name
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate checksums
        id: checksums
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          echo "md5=$(md5sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha1=$(sha1sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum "$APK" | awk '{print $1}')" >> $GITHUB_OUTPUT

      # The notes start with this version's CHANGELOG section (from "## <version> " to the next
      # "## "), then the checksums; GitHub appends the list of merged PRs. A version without a
      # section just gets the checksums.
      - name: Write release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MD5: ${{ steps.checksums.outputs.md5 }}
          SHA1: ${{ steps.checksums.outputs.sha1 }}
          SHA256: ${{ steps.checksums.outputs.sha256 }}
        run: |
          python3 .github/scripts/changelog_section.py "${TAG#v}" CHANGELOG.md > changes.md
          {
            if [ -s changes.md ]; then
              echo "## What's new"
              echo
              cat changes.md
              echo
            fi
            echo "## Checksums"
            echo
            echo "| Algorithm  | Value |"
            echo "|------------|-------|"
            echo "| **MD5**    | \`$MD5\` |"
            echo "| **SHA1**   | \`$SHA1\` |"
            echo "| **SHA-256**| \`$SHA256\` |"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sotto ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab

      # Phones on an older app hear from their relay when this version's app is out: the
      # relay tells them as soon as this signed call says so (otherwise it notices within
      # 5 minutes). The relay holds the public half of CI_RELEASE_KEY; RELAY_URL is a secret
      # only to keep the host out of the public logs. Never fails the release.
      - name: Tell the relay the app is out
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          CI_RELEASE_KEY: ${{ secrets.CI_RELEASE_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash .github/scripts/notify_relay.sh "${TAG#v}" \
            || echo "::warning::Relay not reached; it will notice the release within 5 minutes."

      - name: Upload to Google Play
        if: ${{ env.GOOGLE_PLAY_JSON != '' }}
        env:
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vagujhelyigergely.sotto
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: production
          status: completed
          changesNotSentForReview: false
