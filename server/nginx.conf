# Mounted as conf.d/default.conf, inside nginx's http block.

# No client addresses in the logs: the relay keeps no record of who connected from where.
# Account ids and share codes in paths are left out too.
map $uri $sotto_log_path {
    ~^/v1/identity/resolve/     /v1/identity/resolve/-;
    ~^/v1/identity/[^/]+/keys$  /v1/identity/-/keys;
    default                     $uri;
}
log_format sotto '[$time_local] "$request_method $sotto_log_path $server_protocol" $status $body_bytes_sent $request_time';

# nginx adds the client's address to every error it logs about a connection or request, so
# only emergencies (about nginx itself) are logged here. A failed request still shows in the
# access log, by its status.
error_log /var/log/nginx/error.log emerg;

# With RELAY_HOSTNAME set, nginx answers only that name: nginx-relay-hostname.sh writes the
# name for the servers below and adds default servers that refuse every other connection.

server {
    listen 80;
    server_name _;
    include /etc/nginx/relay/server-name.con[f];
    access_log /var/log/nginx/access.log sotto;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    include /etc/nginx/relay/server-name.con[f];
    access_log /var/log/nginx/access.log sotto;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Request body limit (matches server middleware)
    client_max_body_size 2m;

    # For every location below that sets none of its own.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A path the relay doesn't serve: close the connection without an answer. Scanners
    # probing for admin pages and other software get nothing to go on.
    location / {
        return 444;
    }

    location /v1/ {
        proxy_pass http://server:8000;
    }

    location = /health {
        proxy_pass http://server:8000;
    }

    # No /metrics from outside: only the ops recipe reads it, on 127.0.0.1:8000 inside the
    # server container, so like any path not listed here it gets no answer (the 444 above).

    location = /.well-known/assetlinks.json {
        proxy_pass http://server:8000;
    }

    # The invite page sets its own Content-Security-Policy, which allows its one script and
    # style by their hashes. A location with add_header inherits none of the server's, so the
    # other security headers are repeated here.
    location = /invite {
        proxy_pass http://server:8000;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # WebSocket upgrade. Sets proxy headers of its own, so it repeats the others.
    location /v1/ws {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
